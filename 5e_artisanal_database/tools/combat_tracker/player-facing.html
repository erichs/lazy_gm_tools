<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Combat Tracker - Player View</title>
    <link rel="stylesheet" href="../../css_js/5eadb.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=MedievalSharp&display=swap" rel="stylesheet">

    <style>
        /* --- Adventurer's Journal Theme --- */

        html {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        body {
            /* A dark, wood-like background color for the 'desk' */
            background-color: #383025;
            /* A parchment texture for the main page. You can replace this URL with your own image. */
            background-image: url('https://www.transparenttextures.com/patterns/old-paper.png');

            /* Thematic fonts */
            font-family: 'EB Garamond', serif;
            color: #3d2b1f; /* Dark brown ink color for text */

            margin: 0;
            padding: 20px;
            display: flex;
            min-height: 100vh;
            min-width: 100vw;
            gap: 20px;
        }

        /* Shared style for the 'paper' containers */
        .combat-tracker-container, .reference-container, .image-gallery-container {
            background-color: #fdf5e6; /* Antique white / parchment color */
            padding: 25px;
            border: 1px solid #c8b796; /* Aged border color */
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5); /* Lifts the paper off the desk */
            border-radius: 3px; /* A very slight rounding, like worn paper corners */
        }

        /* Base layout - all panels */
        .combat-tracker-container,
        .reference-container,
        .image-gallery-container {
            min-width: 300px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* All containers hidden by default - take NO space */
        .combat-tracker-container,
        .reference-container,
        .image-gallery-container {
            flex: 0 0 0%;
            min-width: 0;
            display: none;
            padding: 0;
            border: none;
            box-shadow: none;
        }

        /* When visible, panels take equal flex space and restore styling */
        .combat-tracker-container.visible,
        .reference-container.visible,
        .image-gallery-container.visible {
            flex: 1 1 0%;
            min-width: 300px;
            display: block;
            padding: 25px;
            border: 1px solid #c8b796;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5);
        }

        /* Image gallery keeps no padding when visible */
        .image-gallery-container.visible {
            padding: 0;
        }

        /* Specific styling for reference container */
        .reference-container {
            border-left: 2px solid #8a7b66; /* A stronger divider, like the spine of a book */
        }

        /* Image gallery specific styling */
        .image-gallery-container {
            padding: 0; /* No padding for iframe to fill completely */
            position: relative;
            min-height: 400px;
        }

        .image-gallery-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 3px; /* Match container rounding */
        }

        /* Header styling */
        .header h1 {
            font-family: 'MedievalSharp', cursive;
            font-size: 22px;
            color: #5a2d0c; /* A richer brown for headers */
            margin-bottom: 15px;
            text-align: center;
        }

        .initiative-list { 
            max-width: 400px; 
            margin: 0 auto; 
        }

        /* Individual combatant row styling */
        .combatant-row { 
            padding: 12px; 
            margin: 0; 
            border: none; /* Remove modern borders */
            border-bottom: 1px dashed #c8b796; /* An understated divider */
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s ease; /* Smooth transition for turn changes */
        }
        .initiative-list > div:last-child {
             border-bottom: none; /* Remove border from the last item */
        }
        
/* --- OPTION 3: Burnt Paper Effect --- */
.current-turn {
    background-color: #f5eeda; /* The subtle darker parchment works well here */
    /* An inset shadow creates the 'burnt edge' look. This is the key effect. */
    box-shadow: inset 0 0 10px 3px #c78d08;
    
    /* The margin/padding trick makes it stand out from the list */
    margin: 8px -16px;
    padding: 12px 16px;
    font-weight: bold;
    border-radius: 6px; /* A little rounding helps the shadow feel more natural */
}

/* This makes the 'Active' text a dark, sooty brown to match */
.current-turn .status-indicator {
    font-weight: bold;
    color: #cc1a74;
    background-color: transparent;
}


        /* Initiative number, styled like a handwritten note */
        .initiative-number { 
            font-size: 20px; 
            font-weight: bold; 
            color: #5a2d0c;
            margin-right: 12px;
        }

        .combatant-name {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Health and condition emojis */
        .health-status, .conditions {
            font-size: 18px;
            line-height: 1;
        }

        /* Status indicators (re-styled from badges to text) */
        .status-indicator {
            padding: 0;
            border-radius: 0;
            font-size: 16px;
            font-weight: bold;
            font-style: italic;
            color: #665a48;
            background-color: transparent;
        }

        .current-turn .status-indicator {
            font-weight: bold;
            color: #8a2be2; /* Match the magical border color */
            background-color: transparent;
        }

        .up-next-indicator {
            font-weight: bold !important;
            font-style: italic !important;
            color: #006400 !important; /* A dark green for 'On Deck' */
            background-color: transparent !important;
        }

        /* Round counter styling */
        #roundCounter {
            width: 60px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            font-family: 'EB Garamond', serif;
            color: #3d2b1f;
            background-color: #fdf5e6;
            border: none;
            border-bottom: 2px solid #c8b796;
            padding: 4px;
        }
        #roundCounter:focus {
            outline: none;
            border-bottom-color: #8a2be2;
        }
        
        /* Connection Status */
        #connectionStatus {
            font-style: italic;
            color: #665a48;
        }

    </style>
</head>
<body>
    <div class="combat-tracker-container" id="combatTrackerContainer">
        <div class="header">
            <h1 onclick="clearTracker()" style="cursor: pointer;" title="Click to clear tracker and reset">Combat Tracker</h1>
            <div style="margin: 10px 0;">
                <label for="roundCounter" style="font-weight: bold; margin-right: 8px; font-family: 'MedievalSharp', cursive; font-size: 18px;">Round:</label>
                <input type="number" id="roundCounter" value="1" min="1" max="999">
            </div>
        </div>

        <div class="initiative-list" id="initiativeList">
            </div>

        <center><p id="connectionStatus">Connecting to DM tracker...</p></center>
    </div>

    <div class="reference-container" id="referenceContainer">
    </div>

    <div class="image-gallery-container" id="imageGalleryContainer">
        <iframe
            id="imageGalleryFrame"
            src="http://localhost:8080"
            sandbox="allow-same-origin allow-scripts allow-forms"
            loading="lazy"
            title="Image Gallery">
        </iframe>
    </div>

    <script>
        let combatants = [];
        let currentTurnIndex = 0;
        let previousTurnIndex = -1;
        
        // Listen for changes from DM tracker and reference HTML
        window.addEventListener('storage', function(e) {
            if (e.key === 'combatTrackerSync') {
                const data = JSON.parse(e.newValue || '{}');
                updateFromDMTracker(data);
            } else if (e.key === 'playerReferenceHTML') {
                updateReferenceDisplay(e.newValue);
            }
        });
        
        function updateFromDMTracker(data) {
            if (data.combatants && Array.isArray(data.combatants)) {
                combatants = data.combatants;

                const newTurnIndex = data.currentTurnIndex || 0;

                // Check for round transition (turn went from last to first)
                if (combatants.length > 0 &&
                    currentTurnIndex === combatants.length - 1 &&
                    newTurnIndex === 0) {
                    incrementRound();
                }

                previousTurnIndex = currentTurnIndex;
                currentTurnIndex = newTurnIndex;

                renderInitiativeList();
                updateConnectionStatus('Connected');
            }
        }

        function incrementRound() {
            const roundInput = document.getElementById('roundCounter');
            const currentRound = parseInt(roundInput.value) || 1;
            roundInput.value = currentRound + 1;
        }

        function getHealthStatusEmoji(combatant) {
            if (!combatant.maxHp || combatant.maxHp <= 0) return '';
            const hpPercent = (combatant.currentHp / combatant.maxHp) * 100;
            if (hpPercent >= 100) return '';
            else if (hpPercent <= 0) return '💀';
            else if (hpPercent <= 10) return '🚨';
            else if (hpPercent <= 50) return '🩸';
            else return '🩹';
        }

        function getConditionsDisplay(combatant) {
            if (!combatant.conditions || combatant.conditions.length === 0) return '';
            const CONDITIONS = {
                'Blinded': '🙈', 'Charmed': '😍', 'Deafened': '🙉', 'Exhaustion': '🥵',
                'Frightened': '😱', 'Grappled': '⛓️', 'Incapacitated': '🚫', 'Invisible': '🌫️',
                'Paralyzed': '🥶', 'Petrified': '🪨', 'Poisoned': '🤢', 'Prone': '🛌',
                'Restrained': '🕸️', 'Stunned': '💫', 'Unconscious': '😴'
            };
            return combatant.conditions.map(c => CONDITIONS[c] || '❓').join(' ');
        }
        
        function renderInitiativeList() {
            const container = document.getElementById('initiativeList');
            if (combatants.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">No active combat</p>';
                updateLayout(); // Update layout when combat ends
                return;
            }

            container.innerHTML = combatants.map((combatant, index) => {
                const isCurrentTurn = index === currentTurnIndex;
                const nextTurnIndex = (currentTurnIndex + 1) % combatants.length;
                const isUpNext = index === nextTurnIndex && !isCurrentTurn;

                // --- THEMATIC TEXT CHANGE ---
                let statusText = ''; // Default is empty, not 'Waiting'
                if (isCurrentTurn) {
                    statusText = 'Active';
                } else if (isUpNext) {
                    statusText = 'On Deck';
                }

                const healthEmoji = getHealthStatusEmoji(combatant);
                const conditionsDisplay = getConditionsDisplay(combatant);

                return `
                    <div class="combatant-row ${isCurrentTurn ? 'current-turn' : ''}" data-combatant-index="${index}">
                        <div class="combatant-name">
                            <span>${combatant.name}</span>
                            ${healthEmoji ? `<span class="health-status">${healthEmoji}</span>` : ''}
                            ${conditionsDisplay ? `<span class="conditions">${conditionsDisplay}</span>` : ''}
                        </div>
                        <div>
                            <span class="initiative-number">${combatant.initiative}</span>
                            ${statusText ? `<span class="status-indicator ${isUpNext ? 'up-next-indicator' : ''}">${statusText}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            // Update layout when combat starts/changes
            updateLayout();

            // Auto-scroll to ensure active and on-deck combatants are visible
            scrollToActiveCombatants();
        }

        function scrollToActiveCombatants() {
            if (combatants.length === 0) return;

            // Use setTimeout to ensure DOM has updated
            setTimeout(() => {
                const container = document.getElementById('initiativeList');
                const nextTurnIndex = (currentTurnIndex + 1) % combatants.length;

                // Get the active combatant element
                const activeElement = container.querySelector(`[data-combatant-index="${currentTurnIndex}"]`);

                // Get the on-deck combatant element
                const onDeckElement = container.querySelector(`[data-combatant-index="${nextTurnIndex}"]`);

                if (!activeElement) return;

                // Special case: Round increment (turn went from last to first)
                // Scroll to top of page
                if (currentTurnIndex === 0 && previousTurnIndex === combatants.length - 1) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }

                // Check if both active and on-deck elements are visible in viewport
                const viewportHeight = window.innerHeight;
                const activeRect = activeElement.getBoundingClientRect();
                const activeVisible = activeRect.top >= 0 && activeRect.bottom <= viewportHeight;

                let onDeckVisible = true; // Default to true if no on-deck element
                if (onDeckElement) {
                    const onDeckRect = onDeckElement.getBoundingClientRect();
                    onDeckVisible = onDeckRect.top >= 0 && onDeckRect.bottom <= viewportHeight;
                }

                // Only scroll if active or on-deck element is not visible
                if (!activeVisible || !onDeckVisible) {
                    // Determine which elements need to be visible
                    let topElement, bottomElement;

                    if (currentTurnIndex < nextTurnIndex) {
                        // Normal case: active comes before on-deck
                        topElement = activeElement;
                        bottomElement = onDeckElement || activeElement;
                    } else {
                        // Wrapped case: on-deck is at top of list, active is at bottom
                        topElement = onDeckElement || activeElement;
                        bottomElement = activeElement;
                    }

                    // Get positions relative to viewport
                    const topRect = topElement.getBoundingClientRect();
                    const bottomRect = bottomElement.getBoundingClientRect();

                    const topVisible = topRect.top >= 0 && topRect.bottom <= viewportHeight;
                    const bottomVisible = bottomRect.top >= 0 && bottomRect.bottom <= viewportHeight;

                    // Scroll to show both elements if possible
                    if (!bottomVisible) {
                        bottomElement.scrollIntoView({ behavior: 'smooth', block: 'end' });
                    } else if (!topVisible) {
                        topElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }
            }, 100);
        }
        
        function updateConnectionStatus(status) {
            const statusEl = document.getElementById('connectionStatus');
            statusEl.textContent = status === 'Connected' ? 
                'Connected to DM tracker' : 'Waiting for DM tracker...';
            statusEl.style.color = status === 'Connected' ? '#006400' : '#665a48'; // Thematic colors
        }
        
        function updateReferenceDisplay(htmlContent) {
            const container = document.getElementById('referenceContainer');
            if (htmlContent && htmlContent.trim() !== '') {
                container.innerHTML = htmlContent;
                container.classList.add('visible');
            } else {
                container.innerHTML = '';
                container.classList.remove('visible');
            }
            updateLayout();
        }

        function updateImageGalleryVisibility() {
            const imageContainer = document.getElementById('imageGalleryContainer');
            const iframe = document.getElementById('imageGalleryFrame');

            // Image gallery is always visible
            imageContainer.classList.add('visible');

            // Add error handler for iframe
            iframe.onerror = function() {
                console.warn('Image gallery iframe failed to load from localhost:8080');
                // Could show error message in container instead
            };

            updateLayout();
        }

        function updateLayout() {
            // Phase 1: Basic visibility toggle
            // Phase 2 will add intelligent flex sizing
            const combatContainer = document.getElementById('combatTrackerContainer');
            const referenceContainer = document.getElementById('referenceContainer');
            const imageContainer = document.getElementById('imageGalleryContainer');

            // Combat tracker visible only when there are combatants
            if (combatants.length > 0) {
                combatContainer.classList.add('visible');
            } else {
                combatContainer.classList.remove('visible');
            }

            // Image gallery is always visible
            imageContainer.classList.add('visible');

            // Debug logging
            console.log('Layout updated:', {
                combat: combatContainer.classList.contains('visible'),
                combatants: combatants.length,
                reference: referenceContainer.classList.contains('visible'),
                image: imageContainer.classList.contains('visible')
            });
        }

        function initializePlayerView() {
            const existingData = localStorage.getItem('combatTrackerSync');
            if (existingData) {
                updateFromDMTracker(JSON.parse(existingData));
            } else {
                updateConnectionStatus('Waiting');
            }
            const existingReference = localStorage.getItem('playerReferenceHTML');
            if (existingReference) {
                updateReferenceDisplay(existingReference);
            }

            // Initialize image gallery
            updateImageGalleryVisibility();
        }
        
        function clearTracker() {
            if (confirm('Clear combat tracker and reset round counter?')) {
                combatants = [];
                currentTurnIndex = 0;
                previousTurnIndex = -1;
                localStorage.removeItem('combatTrackerSync');
                document.getElementById('roundCounter').value = 1;
                renderInitiativeList();
                updateConnectionStatus('Waiting');
                updateLayout(); // Update layout after clearing
            }
        }

        document.addEventListener('DOMContentLoaded', initializePlayerView);
    </script>
</body>
</html>
